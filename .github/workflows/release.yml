name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - 'scripts/release/**'
      - 'cmd/mpudp/**'
      - 'go.mod'
      - 'go.sum'
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build for a dry run (no GitHub Release is published)
        required: true
        default: v0.0.0-dev
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MPUDP_RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version || 'v0.0.0-dev' }}

jobs:
  test:
    name: Release CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build linux/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up release Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Test on the target architecture
        run: go test -count=1 ./...
      - name: Package binary and notices
        env:
          MPUDP_RELEASE_ARCH: ${{ matrix.arch }}
          MPUDP_RELEASE_OUTPUT: ${{ runner.temp }}/release
        run: bash scripts/release/package "$MPUDP_RELEASE_OUTPUT"
      - name: Verify packaged version and source commit
        env:
          MPUDP_RELEASE_ARCH: ${{ matrix.arch }}
          MPUDP_RELEASE_OUTPUT: ${{ runner.temp }}/release
        run: |
          package="mpudp_${MPUDP_RELEASE_VERSION#v}_linux_${MPUDP_RELEASE_ARCH}"
          smoke_dir=$(mktemp -d)
          tar -xzf "$MPUDP_RELEASE_OUTPUT/$package.tar.gz" -C "$smoke_dir"
          test "$("$smoke_dir/$package/mpudp" --version)" = "mpudp $MPUDP_RELEASE_VERSION (commit $GITHUB_SHA)"
          test -s "$smoke_dir/$package/licenses/gopkg.in/yaml.v3/NOTICE"
          test -s "$smoke_dir/$package/licenses/go/LICENSE"
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble release assets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download both architectures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-linux-*
          merge-multiple: true
          path: release
      - name: Generate and verify checksums
        working-directory: release
        run: |
          test -s "mpudp_${MPUDP_RELEASE_VERSION#v}_linux_amd64.tar.gz"
          test -s "mpudp_${MPUDP_RELEASE_VERSION#v}_linux_arm64.tar.gz"
          sha256sum -- *.tar.gz > checksums.txt
          sha256sum --check checksums.txt
      - name: Upload complete release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: [test, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/release
      - name: Create draft, verify uploaded assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MPUDP_RELEASE_OUTPUT: ${{ runner.temp }}/release
        run: |
          args=(--verify-tag --target "$GITHUB_SHA" --draft --title "MPUDP $MPUDP_RELEASE_VERSION")
          notes="docs/releases/$MPUDP_RELEASE_VERSION.md"
          if [[ -f "$notes" ]]; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
          fi
          latest=true
          if [[ "$MPUDP_RELEASE_VERSION" == *-* ]]; then
            args+=(--prerelease)
            latest=false
          fi
          gh release create "$MPUDP_RELEASE_VERSION" "$MPUDP_RELEASE_OUTPUT"/* "${args[@]}"
          verify_dir=$(mktemp -d)
          gh release download "$MPUDP_RELEASE_VERSION" --dir "$verify_dir"
          cmp "$MPUDP_RELEASE_OUTPUT/checksums.txt" "$verify_dir/checksums.txt"
          (cd "$verify_dir" && sha256sum --check checksums.txt)
          gh release edit "$MPUDP_RELEASE_VERSION" --draft=false --latest="$latest"
          gh release view "$MPUDP_RELEASE_VERSION" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
